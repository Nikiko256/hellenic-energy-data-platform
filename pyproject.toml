[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hellenic-energy-data-platform"
version = "0.1.0"
description = "A local-first batch data platform for Greek electricity and weather analytics."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"

dependencies = [
    "duckdb>=1.0",
    "lxml>=5.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pydantic-settings>=2.0",
    "requests>=2.31",
    "tenacity>=8.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
]

[project.scripts]
hellenic-energy = "hellenic_energy.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]